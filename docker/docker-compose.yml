version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: santac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12gerencial34
      POSTGRES_DB: keycloak
      POSTGRES_PORT: 5434
    command: ["postgres", "-c", "port=5434"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5434"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: santac-rabbitmq2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 12gerencial34
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: santac-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5434/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: 12gerencial34
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: 12gerencial34
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
networks:
  backend:
    driver: bridge
